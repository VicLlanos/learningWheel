<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline – learningWheel</title>
<meta name="theme-color" content="#041E42">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="d-flex align-items-center justify-content-center" style="min-height:100vh;background:#041E42;padding:1.5rem">
    <div class="text-center text-white" style="max-width:26rem">
      <img src="logolearningwheel.png" alt="learningWheel" style="height:64px;margin-bottom:1.5rem">
      <h1 class="h3 mb-3">You're offline</h1>
      <p class="text-white-50 mb-4">learningWheel caches your most recent pages, so you can keep reading. Once you're back online, everything syncs automatically.</p>
      <button class="btn btn-light" onclick="location.reload()">
        <i class="bi bi-arrow-clockwise me-1"></i>Try again
      </button>
      <p class="text-white-50 small mt-4 mb-0">Saved answers and drafts remain on this device.</p>
    </div>
  </div>
</body>
</html>
